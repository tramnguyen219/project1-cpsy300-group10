<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Nutritional Insights</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-semibold mb-1">Nutritional Insights</h1>
    <p class="text-sm text-gray-500 mb-6">Sign in to view the dashboard.</p>

    <div id="errorBox" class="hidden bg-red-100 text-red-700 text-sm p-3 rounded mb-4"></div>

    <div class="flex mb-5 border-b">
      <button id="tabLogin" class="flex-1 py-2 font-medium border-b-2 border-blue-600 text-blue-600">Log in</button>
      <button id="tabRegister" class="flex-1 py-2 font-medium text-gray-500">Register</button>
    </div>

    <form id="authForm" class="space-y-3">
      <div id="nameField" class="hidden">
        <label class="block text-sm text-gray-600 mb-1">Name</label>
        <input id="name" type="text" class="p-2 border rounded w-full" placeholder="Your name">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Email</label>
        <input id="email" type="email" required class="p-2 border rounded w-full" placeholder="you@example.com">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <input id="password" type="password" required class="p-2 border rounded w-full" placeholder="At least 8 characters">
      </div>
      <button id="submitBtn" type="submit" class="bg-blue-600 text-white py-2 px-4 rounded w-full font-medium">Log in</button>
    </form>

    <div class="flex items-center gap-3 my-5">
      <div class="h-px bg-gray-300 flex-1"></div>
      <span class="text-xs text-gray-400">OR</span>
      <div class="h-px bg-gray-300 flex-1"></div>
    </div>

    <button id="googleBtn" class="border py-2 px-4 rounded w-full mb-2 font-medium hover:bg-gray-50">
      Continue with Google
    </button>
  </div>

<script>
const API = "https://diet-analysis-func-cpsy10.azurewebsites.net/api";
let mode = "login";

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.classList.remove("hidden");
}

(function captureOAuthToken() {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) {
    sessionStorage.setItem("token", m[1]);
    history.replaceState(null, "", location.pathname);
    location.href = "dashboard.html";
    return;
  }
  const err = new URLSearchParams(location.search).get("error");
  if (err) showError("Sign-in failed: " + err);
})();

document.getElementById("tabLogin").onclick = () => setMode("login");
document.getElementById("tabRegister").onclick = () => setMode("register");

function setMode(m) {
  mode = m;
  const isReg = m === "register";
  document.getElementById("nameField").classList.toggle("hidden", !isReg);
  document.getElementById("submitBtn").textContent = isReg ? "Create account" : "Log in";
  document.getElementById("errorBox").classList.add("hidden");
  document.getElementById("tabLogin").className =
    "flex-1 py-2 font-medium " + (isReg ? "text-gray-500" : "border-b-2 border-blue-600 text-blue-600");
  document.getElementById("tabRegister").className =
    "flex-1 py-2 font-medium " + (isReg ? "border-b-2 border-blue-600 text-blue-600" : "text-gray-500");
}

document.getElementById("authForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Please wait...";
  try {
    const payload = {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    };
    if (mode === "register") payload.name = document.getElementById("name").value;

    const res = await fetch(`${API}/auth/${mode}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || "Something went wrong."); return; }

    sessionStorage.setItem("token", data.token);
    location.href = "dashboard.html";
  } catch {
    showError("Could not reach the server. Is the backend running?");
  } finally {
    btn.disabled = false;
    setMode(mode);
  }
};

document.getElementById("googleBtn").onclick = () => location.href = `${API}/auth/google/start`;
</script>
</body>
</html>
